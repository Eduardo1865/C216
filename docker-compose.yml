services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: c216-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/c216
    depends_on:
      - db
    volumes:
      - ./backend:/app
    command: poetry run uvicorn app.main:app --host 0.0.0.0 --reload

  db:
    image: postgres:16-alpine
    container_name: c216
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=c216
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
