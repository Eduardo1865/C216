services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: c216-projeto-final-backend
    container_name: c216-projeto-final-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://admin:admin@db:5432/c216
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: sh -c "poetry run alembic upgrade head && poetry run uvicorn app.main:app --host 0.0.0.0 --reload"
    

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    image: c216-projeto-final-frontend
    container_name: c216-projeto-final-frontend
    ports:
      - "5173:80"
    
   

  db:
    image: postgres:16-alpine
    container_name: c216-projeto-final-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: c216-projeto-final
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d c216"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
